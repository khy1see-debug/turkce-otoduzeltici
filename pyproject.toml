[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turkce-otoduzeltici"
version = "0.1.0"
description = "Çevrimdışı Türkçe yazım ve metin düzeltici"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["wordfreq>=3.1.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
turkce-duzelt = "src.cli:main"
turkce-duzelt-fast = "src.daemon_client:main"
turkce-duzelt-daemon = "src.daemon:main"

[tool.setuptools]
packages = ["src", "src.data"]
include-package-data = true

[tool.setuptools.package-data]
src = ["data/*.gz"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
