name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install project and development tools
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev
      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q
      - name: Check unused imports and names
        run: uv run --locked --python ${{ matrix.python-version }} ruff check src tests
      - name: Build and smoke-test the distributable wheel
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          uv build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as package:
              assert not any(name.endswith("kisisel_sozluk.txt") for name in package.namelist())
          PY
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/turkce-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/turkce-wheel-smoke/bin/python" dist/*.whl
          result=$("$RUNNER_TEMP/turkce-wheel-smoke/bin/turkce-duzelt" "sendemigeliyorusn")
          test "$result" = "Sen de mi geliyorsun?"
